services:
  gateway:
    image: nginx:1.31.0-alpine
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./gateway/miner-gateway.${GATEWAY_TEMPLATE:-tao}.conf.template:/etc/nginx/conf.d/miner-gateway.conf.template:ro
      - ./gateway/entrypoint.sh:/docker-entrypoint.d/90-blockmachine.sh:ro
      - certbot_webroot:/var/www/certbot:ro
    environment:
      SECRET_V1: ${SECRET_V1}
      SECRET_V2: ${SECRET_V2:-}
      BACKEND_HOST: ${BACKEND_HOST:-host.docker.internal}
      BACKEND_PORT: ${BACKEND_PORT:-9944}
      BACKEND_HTTP_PORT: ${BACKEND_HTTP_PORT:-8545}
      BACKEND_WS_PORT: ${BACKEND_WS_PORT:-8546}
      METRICS_HOST: metrics
      METRICS_PORT: ${METRICS_PORT:-9100}
      # The capacity helper runs on the host, not in this stack — it is a
      # binary you install next to your node. Same route as the node itself.
      CAPACITY_HELPER_HOST: ${CAPACITY_HELPER_HOST:-host.docker.internal}
      CAPACITY_HELPER_PORT: ${CAPACITY_HELPER_PORT:-9955}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/etc/nginx/ssl/key.pem}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - metrics
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, NOT localhost: nginx listens on 0.0.0.0:80, and in this
      # image localhost resolves to ::1 first, so the check was refused every
      # time and the gateway was never marked healthy.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  metrics:
    image: python:3.12-alpine
    command: ["python", "/app/exporter.py"]
    volumes:
      - ./metrics:/app:ro
      - ./.git:/repo/.git:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /proc:/host/proc:ro
    environment:
      CHAIN: ${CHAIN:-tao}
      METRICS_PORT: ${METRICS_PORT:-9100}
      METRICS_SECRET_V1: ${SECRET_V1}
      METRICS_SECRET_V2: ${SECRET_V2:-}
      NODE_RPC_URL: http://mainnet-lite:9944
      NODE_NATIVE_METRICS_URL: ${NODE_NATIVE_METRICS_URL:-}
      GATEWAY_HEALTH_URL: http://gateway/health
      HOST_PROC_PATH: /host/proc
      GIT_DIR: /repo/.git
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}
      BM_MINER_GIT_SHA: ${BM_MINER_GIT_SHA:-unknown}
      BM_MINER_GIT_BRANCH: ${BM_MINER_GIT_BRANCH:-unknown}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mainnet-lite:
    image: ghcr.io/raofoundation/subtensor:latest
    cpu_count: 4
    mem_limit: 40000000000
    memswap_limit: 80000000000
    container_name: subtensor-mainnet-lite
    ports:
      - "127.0.0.1:9944:9944"
    volumes:
      - mainnet-lite-volume:/data
    command:
      - --base-path=/data
      - --chain=./chainspecs/raw_spec_finney.json
      - --rpc-external
      - --rpc-max-connections 2000
      - --rpc-cors=all
      - --no-mdns
      - --bootnodes=/dns/bootnode.finney.chain.opentensor.ai/tcp/30333/ws/p2p/12D3KooWRwbMb85RWnT8DSXSYMWQtuDwh4LJzndoRrTDotTR5gDC
      - --sync=warp
      - --database paritydb
      - --db-cache 1024

volumes:
  certbot_webroot:
  mainnet-lite-volume:
